[workspace]
members = ["crates/portalis-core", "crates/portalisd"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1.0"
argon2 = "0.5"
aws-config = { version = "1.8", default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls"] }
aws-sdk-s3 = { version = "1.144", default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls"] }
aws-types = "1.5"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4.5", features = ["derive", "env"] }
getrandom = "0.3"
hex = "0.4"
http = "1.3"
http-body-util = "0.1"
hyper = { version = "1.11", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "tokio"] }
ipnet = { version = "2.11", features = ["serde"] }
mnl = "0.3"
nftnl = { version = "0.9.4", features = ["nftnl-1-3-0"] }
nftnl-sys = { version = "0.6.4", features = ["nftnl-1-3-0"] }
rusqlite = { version = "0.37", features = ["bundled", "chrono", "uuid"] }
rust-embed = "8.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["serde", "v4"] }
zstd = "0.13"
