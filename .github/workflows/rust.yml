name: Rust

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool make pkg-config xz-utils bzip2 curl
      - name: Build native Netfilter libraries
        run: |
          TARGET_HOST=x86_64-linux-gnu bash ci/build-native.sh x86_64-unknown-linux-gnu > native.env
          cat native.env >> "$GITHUB_ENV"
      - name: Build frontend
        working-directory: web
        run: npm ci && npm run build
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  build:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
            host: x86_64-linux-musl
            toolchain: x86_64-unknown-linux-musl
          - arch: arm64
            target: aarch64-unknown-linux-musl
            host: aarch64-linux-musl
            toolchain: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend
        working-directory: web
        run: npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool make pkg-config xz-utils bzip2
      - name: Install musl cross toolchain
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.toolchain }}" in
            x86_64-unknown-linux-musl) sha=5f20e367608d6e547c04534d37d00ecedbaa0c2e82730df12957b3332fa36a2d ;;
            aarch64-unknown-linux-musl) sha=90282c463498dcdab9b96a464a0925d53f30c884b2d7b25e3998999416ae34b8 ;;
          esac
          archive="$RUNNER_TEMP/${{ matrix.toolchain }}.tar.xz"
          curl --fail --location --retry 3 "https://github.com/cross-tools/musl-cross/releases/download/20260515/${{ matrix.toolchain }}.tar.xz" -o "$archive"
          echo "$sha  $archive" | sha256sum --check
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/${{ matrix.toolchain }}/bin" >> "$GITHUB_PATH"
          echo "TARGET_CC=$RUNNER_TEMP/${{ matrix.toolchain }}/bin/${{ matrix.toolchain }}-gcc" >> "$GITHUB_ENV"
          echo "TARGET_AR=$RUNNER_TEMP/${{ matrix.toolchain }}/bin/${{ matrix.toolchain }}-ar" >> "$GITHUB_ENV"
      - name: Build static Netfilter libraries
        run: |
          TARGET_HOST="${{ matrix.host }}" bash ci/build-native.sh "${{ matrix.target }}" > native.env
          cat native.env >> "$GITHUB_ENV"
      - name: Build release binaries
        run: |
          cargo build --locked --release --target "${{ matrix.target }}" -p portalisd --bin portalisd --bin portalisctl
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/portalisd" "dist/portalis-linux-${{ matrix.arch }}"
          cp "target/${{ matrix.target }}/release/portalisctl" "dist/portalisctl-linux-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: portalis-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  integration:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool make pkg-config xz-utils bzip2 curl podman
      - name: Build native Netfilter libraries
        run: |
          TARGET_HOST=x86_64-linux-gnu bash ci/build-native.sh x86_64-unknown-linux-gnu > native.env
          cat native.env >> "$GITHUB_ENV"
      - name: Build integration test binary
        run: |
          cargo test -p portalisd --no-run --locked
          find target/debug/build/portalisd -type f -perm -111 -name 'portalisd-*' | sort | tail -1 > test-bin
      - name: Run MinIO backup integration test in an isolated Podman network
        shell: bash
        run: |
          set -euo pipefail
          podman network create portalis-integration
          trap 'podman rm -f portalis-minio-integration >/dev/null 2>&1 || true; podman network rm portalis-integration >/dev/null 2>&1 || true' EXIT
          podman run -d --name portalis-minio-integration --network portalis-integration -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin quay.io/minio/minio:latest server /data
          test_bin="$(cat test-bin)"
          podman run --rm --network portalis-integration -e PORTALIS_S3_ENDPOINT=http://portalis-minio-integration:9000 -v "$PWD/$test_bin:/usr/local/bin/portalisd-test:ro" ubuntu:24.04 bash -c '
            set -euo pipefail
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates curl libmnl0 libnftnl11
            until curl -fsS http://portalis-minio-integration:9000/minio/health/ready >/dev/null; do sleep 1; done
            /usr/local/bin/portalisd-test minio_round_trip --ignored --nocapture
          '

  release:
    if: github.ref_type == 'tag' || (github.ref_type == 'branch' && github.ref_name == 'main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@v4
        with:
          pattern: portalis-linux-*
          path: artifacts
          merge-multiple: true
      - name: Assemble release
        run: |
          set -euo pipefail
          mkdir release
          cp artifacts/portalis-linux-* release/
          cp artifacts/portalisctl-linux-* release/
          cp install.sh packaging/portalis.service release/
          (cd release && sha256sum -- * | sort -k2) > release/checksums.txt
          git log -20 --oneline > release_notes.txt
      - name: Update rolling main tag
        if: github.ref_type == 'branch' && github.ref_name == 'main'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -f main "$GITHUB_SHA"
          git push origin refs/tags/main --force
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'branch' && 'main' || github.ref_name }}
          target_commitish: ${{ github.sha }}
          body_path: release_notes.txt
          files: release/*
